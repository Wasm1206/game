<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b08">
<title>فرمانده بیابان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen top-down canvas. Slim resource bar on top, minimap right, alert feed left, command panel at the bottom. Menu, match-search and result screens are modal layers. */
:root {
  --bg: #0d0b08; --ink: #f2ead8; --muted: #b3a78e; --panel: rgba(22, 18, 12, .86); --line: rgba(242, 234, 216, .16);
  --gold: #f0c35a; --good: #6fcf7a; --bad: #ef6a55; --blue: #5aa0ff; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pad { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(5px); }
#top { position: absolute; top: 0; left: 0; right: 0; padding-top: max(8px, env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; pointer-events: none; }
#res, #tools { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip small { font-weight: 600; color: var(--muted); font-size: 11px; }
.chip.low b { color: var(--bad); }
.ib { min-width: 38px; height: 36px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; font-weight: 700; }
.ib:hover, .ib.on { background: rgba(70, 56, 30, .9); border-color: var(--gold); }
#mini { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 56px; width: 150px; height: 150px; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; touch-action: none; }
#mm { width: 100%; height: 100%; display: block; }
#feed { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 56px; width: min(168px, 40vw); display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.note { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 4px 8px; opacity: .92; background: var(--panel); border: 1px solid var(--line); border-inline-start: 4px solid var(--gold); border-radius: 8px; font-weight: 600; font-size: 10.5px; line-height: 1.4; cursor: pointer; animation: nin .25s ease-out; }
.note .go { margin-inline-start: auto; font-size: 10px; background: var(--gold); color: #231a08; border: 0; border-radius: 6px; padding: 2px 6px; font-weight: 800; }
.note.bad { border-inline-start-color: #ff3b2a; background: rgba(120, 18, 12, .94); color: #fff; font-weight: 800; border-color: rgba(255, 90, 70, .7); animation: nin .25s ease-out, pulse 1.4s ease-in-out 2; }
.note.warn { border-inline-start-color: #ff8a3a; }
@keyframes pulse { 50% { box-shadow: 0 0 12px rgba(255, 60, 40, .8); } } .note.good { border-inline-start-color: var(--good); }
@keyframes nin { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
#bar { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#quick, #quick2, #panel, #sheet { pointer-events: auto; }
#quick { display: flex; gap: 6px; justify-content: center; align-items: flex-end; }
.ib.sm { min-width: 40px; padding: 0 6px; font-size: 18px; }
.ib.cmd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 60px; height: 52px; padding: 0 6px; font-size: 12px; background: rgba(40, 30, 14, .92); border-color: rgba(240, 195, 90, .45); }
.ib.cmd i { font-style: normal; font-size: 21px; line-height: 1; }
#qAtk { border-color: rgba(239, 106, 85, .7); } #qAmb { border-color: rgba(111, 207, 122, .7); }
#quick .ib, #quick2 .ib { flex: none; }
#quick2 { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; scrollbar-width: none; pointer-events: auto; }
#panel { display: flex; gap: 12px; padding: 7px 12px; min-height: 0; align-items: stretch; }
#info { flex: 0 0 min(260px, 38vw); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
#info h3 { margin: 0; font-size: 15px; font-weight: 800; }
#info p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.hpb { height: 5px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; } .hpb i { display: block; height: 100%; background: var(--good); }
#acts { flex: 1; display: flex; gap: 6px; overflow-x: auto; align-items: stretch; scrollbar-width: thin; min-width: 0; }
.act { flex: none; min-width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 8px; background: rgba(60, 48, 26, .75); border: 1px solid var(--line); border-radius: 9px; font-weight: 700; font-size: 12px; text-align: center; }
.act:hover:not(:disabled) { border-color: var(--gold); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act .e { font-size: 22px; line-height: 1.1; } .act .c { color: var(--gold); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.act .pg { width: 100%; height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; } .act .pg i { display: block; height: 100%; background: var(--blue); }
#sheet { padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; }
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: radial-gradient(ellipse at 50% 30%, rgba(70, 52, 24, .6), rgba(8, 6, 3, .95) 70%); overflow: auto; z-index: 5; }
.card { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); font-weight: 900; line-height: 1.2; }
.card h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp > label { font-weight: 800; font-size: 13px; color: var(--gold); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 7px 14px; background: rgba(60, 48, 26, .7); border: 1px solid var(--line); border-radius: 8px; font-weight: 700; }
.seg button.on { background: var(--gold); color: #231a08; border-color: var(--gold); }
.sw { width: 46px; height: 46px; border-radius: 10px; border: 2px solid transparent; font-size: 22px; display: flex; align-items: center; justify-content: center; padding: 0; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
.big { font-weight: 900; font-size: 19px; color: #231a08; background: var(--gold); border: 0; border-radius: 12px; padding: 13px 20px; }
.big:hover { background: #ffd57a; }
.vs { display: flex; flex-wrap: wrap; gap: 8px; }
.vs div { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: rgba(60, 48, 26, .7); border-inline-start: 4px solid; font-weight: 700; animation: nin .3s ease-out; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--gold); animation: sp 1s linear infinite; margin: 0 auto; }
@keyframes sp { to { transform: rotate(360deg); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { padding: 8px 10px; background: rgba(60, 48, 26, .7); border-radius: 8px; font-size: 12px; color: var(--muted); } .stats b { display: block; font-size: 18px; color: var(--ink); }
.help { font-size: 13px; line-height: 1.9; color: var(--muted); } .help b { color: var(--ink); }
#flash { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 10px 22px; font-size: clamp(18px, 4vw, 28px); font-weight: 900; pointer-events: none; text-align: center; animation: nin .3s ease-out; }
@media (max-width: 640px) { #mini { width: 112px; height: 112px; } .act { min-width: 74px; } #info { flex-basis: 34vw; } .chip { padding: 4px 7px; } }
@media (prefers-reduced-motion: reduce) { .note, .vs div, #flash { animation: none; } }
#game { height: 100vh; height: 100dvh; }
html, body { overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; }
#bFull { display: inline-block; }
@media (max-width: 640px), (max-height: 520px) {
  body { font-size: 12.5px; }
  #top { gap: 4px; padding-top: max(4px, env(safe-area-inset-top, 0px)); }
  .chip { padding: 3px 6px; gap: 4px; font-size: 12px; }
  .ib { min-width: 34px; height: 32px; padding: 0 7px; }
  #mini { width: 92px; height: 92px; top: 44px; }
  #feed { top: 44px; width: min(150px, 38vw); font-size: 11px; }
  .act { min-width: 64px; padding: 4px 5px; }
  #flash { font-size: clamp(13px, 3vw, 20px); padding: 6px 14px; max-width: 70vw; top: 14%; }
  #info h3 { font-size: 13px; } #info p { font-size: 11px; line-height: 1.4; }
  #panel { padding: 5px 8px; gap: 8px; }
  .act .e { font-size: 18px; }
}
#rot { display: none; position: fixed; inset: 0; z-index: 9999; background: #0d0b08; color: #f0c35a; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: 800; line-height: 2; }
@media (orientation: landscape) and (pointer: coarse) and (max-height: 560px) { #rot { display: flex; } }
@media (orientation: portrait) and (max-width: 700px) {
  #top { flex-direction: column; align-items: stretch; gap: 4px; }
  #res { flex-wrap: nowrap; justify-content: space-between; } #res .chip { flex: 1; justify-content: center; padding: 3px 4px; font-size: 11.5px; }
  #tools { justify-content: flex-end; }
  #mini { top: 84px; width: 96px; height: 96px; }
  #feed { top: 84px; width: min(150px, 44vw); }
  #panel { flex-direction: column; gap: 4px; max-height: 30vh; overflow: hidden; }
  #info { flex: none; } #info h3 { font-size: 13px; } #info p { font-size: 11px; line-height: 1.35; }
  #acts { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .act { min-width: 62px; }
  #quick { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; max-width: 100vw; -webkit-overflow-scrolling: touch; }
  #quick2 { flex-wrap: wrap; justify-content: center; }
}
@media (max-height: 460px) and (orientation: landscape) {
  #mini { width: 80px; height: 80px; }
  #info { flex-basis: 26vw; }
  .act { min-width: 58px; }
}
</style>
</head>
<body>

<div id="rot"><div>📱↻<br>گوشی را عمودی بگیرید</div></div>
<div id="game" dir="rtl" lang="fa">
  <canvas id="c"></canvas>
  <div id="top" class="pad">
    <div id="res">
      <div class="chip glass" title="دلار">💵 <b id="rM">۰</b><small id="rMi"></small></div>
      <div class="chip glass" title="نفت">🛢️ <b id="rO">۰</b><small id="rOi"></small></div>
      <div class="chip glass" title="جمعیت نیرو">👥 <b id="rP">۰</b></div>
      <div class="chip glass" title="زمان">⏱ <b id="rT">۰:۰۰</b></div>
    </div>
    <div id="tools">
      <button class="ib" id="bSpd" type="button" title="سرعت">۱×</button>
      <button class="ib" id="bPause" type="button" title="مکث">⏸</button>
      <button class="ib" id="bSnd" type="button" title="صدا">🔊</button>
      <button class="ib" id="bFull" type="button" title="تمام‌صفحه">⛶</button>
      <button class="ib" id="bMenu" type="button" title="منو">☰</button>
    </div>
  </div>
  <div id="mini"><canvas id="mm" width="150" height="150"></canvas></div>
  <div id="feed"></div>
  <div id="flash" class="glass" hidden></div>
  <div id="bar" class="pad">
    <div id="quick">
      <button class="ib sm" id="qHome" type="button" title="پایگاه">🏰</button>
      <button class="ib sm" id="qAll" type="button" title="همهٔ نیروها">🪖</button>
      <button class="ib cmd" id="qAtk" type="button"><i>⚔️</i>حمله</button>
      <button class="ib cmd" id="qAmb" type="button"><i>🌿</i>کمین</button>
      <button class="ib cmd" id="qSearch" type="button"><i>🔍</i>جستجو</button>
      <button class="ib cmd" id="qStop" type="button"><i>⏹</i>توقف</button>
      <button class="ib sm" id="qSup" type="button" title="پشتیبانی">✈️</button>
      <button class="ib sm" id="qMore" type="button" title="بیشتر">⋯</button>
    </div>
    <div id="quick2" hidden>
      <button class="ib" id="qMv" type="button">🏃 حرکت بی‌درگیری</button>
      <button class="ib" id="qWall" type="button">🧱 دیوار دفاعی</button>
      <button class="ib" id="qBox" type="button">⬚ انتخاب جعبه‌ای</button>
      <button class="ib" id="qAuto" type="button">🤖 جستجوی خودکار نیروی جدید</button>
    </div>
    <div id="sheet" class="glass" hidden></div>
    <div id="panel" class="glass"><div id="info"></div><div id="acts"></div></div>
  </div>

  <div id="menu" class="modal">
    <div class="card glass">
      <div><h1>فرمانده بیابان ⚔️</h1><h2>مقر بساز، نیرو بخر، نقشهٔ تاریک را کشف کن و دشمن را نابود کن.</h2></div>
      <div class="grp"><label>اندازهٔ نقشه</label><div class="seg" id="oSize"></div></div>
      <div class="grp"><label>محیط</label><div class="seg" id="oBiome"></div></div>
      <div class="grp"><label>تعداد دشمن: <span id="oEnV">۳</span></label><input type="range" id="oEn" min="1" max="7" value="3"></div>
      <div class="grp"><label>سختی دشمن</label><div class="seg" id="oDiff"></div></div>
      <div class="grp"><label>🔥 نقشه‌های چالشی (سخت، با بی‌طرف‌های قوی)</label><div class="seg" id="oHard"></div></div>
      <div class="grp"><label>زامبی‌ها</label><div class="seg" id="oZom"></div></div>
      <div class="grp"><label>سرمایهٔ شروع</label><div class="seg" id="oRich"></div></div>
      <div class="grp"><label>مه جنگ</label><div class="seg" id="oFog"></div></div>
      <div class="grp"><label>رنگ و نماد تو</label><div class="seg" id="oColor"></div></div>
      <div class="grp"><label>یار ربات</label><div class="seg" id="oAlly"></div></div>
      <button class="big" id="bStart" type="button">🔎 پیدا کردن حریف و شروع</button>
      <div class="help" id="help"></div>
      <button class="ib" id="bResume" type="button" hidden>ادامهٔ بازی</button>
    </div>
  </div>
  <div id="match" class="modal" hidden>
    <div class="card glass"><div class="spin"></div><h2 id="mTxt" style="text-align:center">در حال جستجوی حریف...</h2><div class="vs" id="mVs"></div></div>
  </div>
  <div id="end" class="modal" hidden>
    <div class="card glass"><h1 id="eT"></h1><h2 id="eS"></h2><div class="stats" id="eStats"></div><button class="big" id="bAgain" type="button">بازی تازه</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TS = 32;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  function angLerp(a, b, k) { return a + angDiff(a, b) * Math.min(1, k); }
  var FONT = 'Vazirmatn, Tahoma, "Segoe UI", sans-serif';

  /* ---------- factions: color + emblem ---------- */
  var COLORS = [
    { k: 'blue', fa: 'آبی', c: '#3b82f6', l: '#9cc3ff', d: '#1b3a86', e: '⭐' },
    { k: 'red', fa: 'قرمز', c: '#ef4444', l: '#ff9a8c', d: '#7f1d1d', e: '☠️' },
    { k: 'green', fa: 'سبز', c: '#22c55e', l: '#8ee6a4', d: '#14532d', e: '🦅' },
    { k: 'yellow', fa: 'زرد', c: '#eab308', l: '#fbe27a', d: '#7a5a05', e: '⚡' },

    { k: 'purple', fa: 'بنفش', c: '#a855f7', l: '#d4a8ff', d: '#4c1d95', e: '🐺' },
    { k: 'gray', fa: 'خاکستری', c: '#9ca3af', l: '#d1d5db', d: '#374151', e: '⚙️' },
    { k: 'white', fa: 'سفید', c: '#f3f4f6', l: '#ffffff', d: '#6b7280', e: '👑' }
  ];
  var TRIBES = [
    { k: 'tr1', fa: 'تاجران صحرا', c: '#c9a35a', l: '#e3c88a', d: '#7a5a22', e: '🐪' },
    { k: 'tr2', fa: 'کوهنشینان', c: '#9a8a78', l: '#c4b8a8', d: '#5a4e42', e: '⛰️' },
    { k: 'tr3', fa: 'ماهیگیران', c: '#3aa0a8', l: '#8ad4d8', d: '#1c5a60', e: '⚓' },
    { k: 'tr4', fa: 'کوچ‌نشینان', c: '#9aa04a', l: '#c8ce80', d: '#56591e', e: '🏕️' }
  ];
  var NEU = { k: 'neutral', fa: 'بی‌طرف', c: '#b49a6a', l: '#d9c79a', d: '#4d3f26', e: '🚚' };
  var NAMES = ['سرهنگ آرش', 'فرمانده کاوه', 'ژنرال بهرام', 'کاپیتان سینا', 'سردار رستم', 'ژنرال نادر', 'سرگرد پویا', 'فرمانده شاهین', 'سرتیپ کیان', 'سروان مهران'];

  /* ---------- units ---------- */
  var UD = {
    inf:  { n: 'تفنگدار', ico: '🪖', hp: 70, sp: 56, r: 6, rng: 130, cd: .85, dmg: 8, kind: 'rifle', vis: 6, cost: 60, oil: 0, time: 3, pop: 1, cls: 'inf', bld: 'barracks', lvl: 1 },
    rkt:  { n: 'ضدزره', ico: '🚀', hp: 60, sp: 50, r: 6, rng: 150, cd: 1.8, dmg: 24, kind: 'rocket', vis: 6, cost: 110, oil: 0, time: 4.5, pop: 1, cls: 'inf', bld: 'barracks', lvl: 1 },
    snp:  { n: 'تک‌تیرانداز', ico: '🎯', hp: 42, sp: 48, r: 6, rng: 270, cd: 2.4, dmg: 34, kind: 'sniper', vis: 9, cost: 160, oil: 0, time: 5.5, pop: 1, cls: 'inf', bld: 'barracks', lvl: 2 },
