<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>خط مقدم — میدان نبرد ۲۰ مرحله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f0c;
    --panel:#12180f;
    --olive:#5a6b3a;
    --olive-dim:#39432688;
    --amber:#e8a33d;
    --red:#c1443c;
    --steel:#4fa3b5;
    --ink:#e9e6d8;
    --ink-dim:#9aa08c;
    --line: #3a4530;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:'Chakra Petch', sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  .stencil{ font-family:'Black Ops One', sans-serif; letter-spacing:1px; }

  #game-root{ position:fixed; inset:0; width:100%; height:100%; }

  canvas#battlefield{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    background:
      radial-gradient(ellipse at 50% 0%, #17200f 0%, #0b0f0c 65%);
  }

  /* ---------- overlay screens ---------- */
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    padding:28px 20px; text-align:center;
    background:
      linear-gradient(180deg, rgba(11,15,12,0.92), rgba(11,15,12,0.97)),
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(90,107,58,0.05) 18px 19px);
    z-index:20;
  }
  .hidden{ display:none !important; }

  .brand-eyebrow{
    font-size:11px; letter-spacing:4px; color:var(--amber); opacity:.85;
    border:1px solid var(--olive-dim); padding:4px 12px; border-radius:2px;
  }
  .brand-title{
    font-size:38px; color:var(--ink); margin:6px 0 0 0; line-height:1.3;
    text-shadow:0 0 18px rgba(232,163,61,.25);
  }
  .brand-sub{ font-size:14px; color:var(--ink-dim); max-width:320px; line-height:1.9; margin-bottom:6px;}

  input.name-input{
    width:min(300px,80vw); padding:14px 16px; font-size:17px;
    background:#0f140c; border:1px solid var(--olive); color:var(--ink);
    border-radius:3px; text-align:center; font-family:inherit;
    outline:none;
  }
  input.name-input:focus{ border-color:var(--amber); box-shadow:0 0 0 2px rgba(232,163,61,.2); }

  .btn{
    font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:16px;
    padding:14px 30px; border-radius:3px; border:1px solid var(--olive);
    background:linear-gradient(180deg, #3d4a26, #262f16);
    color:var(--ink); letter-spacing:1px; cursor:pointer; min-width:220px;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ border-color:var(--amber); background:linear-gradient(180deg,#8a5a1f,#5c3a12); color:#fff3dc; }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-dim); font-size:13px; padding:10px 20px; min-width:0;}

  .divider{ width:60px; height:1px; background:var(--line); margin:6px 0; }

  /* leaderboard */
  .board-wrap{ width:min(420px,90vw); max-height:56vh; overflow-y:auto; border:1px solid var(--line); border-radius:4px; background:#0e130b;}
  table.board{ width:100%; border-collapse:collapse; font-size:14px;}
  table.board th{ position:sticky; top:0; background:#171f10; color:var(--amber); font-weight:600; padding:8px 6px; font-size:11px; letter-spacing:1px; border-bottom:1px solid var(--line);}
  table.board td{ padding:7px 6px; border-bottom:1px solid #1b2314; color:var(--ink); }
  table.board tr:first-child td{ color:var(--amber); font-weight:700; }
  table.board td.rank{ color:var(--ink-dim); width:26px; }
  table.board td.num{ font-family:'Chakra Petch',sans-serif; text-align:left; direction:ltr; }
  .empty-note{ padding:24px; color:var(--ink-dim); font-size:13px; }

  /* HUD */
  #hud{
    position:absolute; inset:0; pointer-events:none; z-index:10;
  }
  .hud-top{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:12px 14px; gap:10px;
  }
  .hud-chip{
    background:rgba(15,20,12,.72); border:1px solid var(--line); border-radius:4px;
    padding:6px 10px; font-size:13px; backdrop-filter:blur(2px);
  }
  .hud-chip b{ color:var(--amber); font-weight:700; }
  .hearts{ display:flex; gap:4px; }
  .heart{ width:16px; height:16px; }
  .level-banner{
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
  }
  .level-banner .stencil{ font-size:15px; color:var(--amber); text-shadow:0 0 10px rgba(232,163,61,.4); }

  /* joystick */
  #joyzone{ position:absolute; left:0; bottom:0; width:46%; height:46%; pointer-events:auto; }
  #joy-base{
    position:absolute; width:104px; height:104px; border-radius:50%;
    border:2px solid rgba(232,163,61,.35); background:rgba(90,107,58,.12);
    display:none;
  }
  #joy-knob{
    position:absolute; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8c98d, #8a5a1f);
    box-shadow:0 0 12px rgba(232,163,61,.5);
  }

  .center-msg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:15;
  }
  .center-msg .stencil{ font-size:30px; color:var(--amber); text-shadow:0 2px 14px rgba(0,0,0,.6); opacity:0; }

  .stat-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:4px 0 8px; }
  .stat-pill{ background:#161f0d; border:1px solid var(--line); border-radius:3px; padding:6px 12px; font-size:13px;}
  .stat-pill b{ color:var(--amber); }

  @media (max-height: 560px){
    .brand-title{ font-size:28px; }
    .board-wrap{ max-height:42vh; }
  }
</style>
</head>
<body>

<div id="game-root">
  <canvas id="battlefield"></canvas>

  <!-- ===== MENU ===== -->
  <div id="screen-menu" class="screen">
    <div class="brand-eyebrow">عملیات ۲۰ مرحله‌ای</div>
    <h1 class="brand-title stencil">خط مقدم</h1>
    <p class="brand-sub">وارد میدان نبرد شو، از پشت کاور پیش برو، دشمن‌ها رو حذف کن، سکه جمع کن و تا مرحله ۲۰ دووم بیار. هر مرحله سخت‌تر می‌شه.</p>
    <input id="player-name" class="name-input" type="text" maxlength="16" placeholder="اسمت رو وارد کن…">
    <button id="btn-start" class="btn btn-primary">ورود به میدان</button>
    <button id="btn-open-board" class="btn btn-ghost">🏆 جدول امتیازات</button>
  </div>

  <!-- ===== LEADERBOARD ===== -->
  <div id="screen-board" class="screen hidden">
    <div class="brand-eyebrow">لیدربورد</div>
    <h2 class="brand-title stencil" style="font-size:26px;">برترین‌ها</h2>
    <div id="board-container" class="board-wrap"></div>
    <button id="btn-board-back" class="btn btn-ghost">بازگشت</button>
  </div>

  <!-- ===== LEVEL INTRO ===== -->
  <div id="screen-levelintro" class="screen hidden">
    <div class="brand-eyebrow" id="intro-eyebrow">مرحله بعدی</div>
    <h1 class="brand-title stencil" id="intro-title">مرحله ۱</h1>
    <p class="brand-sub" id="intro-desc">آماده باش…</p>
    <button id="btn-level-go" class="btn btn-primary">شروع</button>
  </div>

  <!-- ===== GAME OVER / VICTORY ===== -->
  <div id="screen-end" class="screen hidden">
    <div class="brand-eyebrow" id="end-eyebrow">پایان عملیات</div>
    <h1 class="brand-title stencil" id="end-title">شکست</h1>
    <div class="stat-row">
      <div class="stat-pill">امتیاز: <b id="end-score">0</b></div>
      <div class="stat-pill">مرحله: <b id="end-level">1</b></div>
      <div class="stat-pill">سکه: <b id="end-coins">0</b></div>
    </div>
    <div class="divider"></div>
    <div id="board-container-end" class="board-wrap"></div>
    <button id="btn-retry" class="btn btn-primary">نبرد دوباره</button>
    <button id="btn-end-menu" class="btn btn-ghost">منوی اصلی</button>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-chip">امتیاز: <b id="hud-score">0</b></div>
      <div class="hearts" id="hud-hearts"></div>
      <div class="hud-chip">سکه: <b id="hud-coins">0</b></div>
    </div>
    <div class="level-banner"><span class="stencil" id="hud-level">مرحله ۱ / ۲۰</span></div>
    <div class="center-msg"><span class="stencil" id="center-msg-text"></span></div>
    <div id="joyzone">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   STORAGE HELPERS (shared leaderboard)
============================================================ */
const LB_KEY = "leaderboard-data";

async function loadLeaderboard(){
  try{
    const res = await window.storage.get(LB_KEY, true);
    if(!res) return [];
    const arr = JSON.parse(res.value);
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    return [];
  }
}

async function saveScore(entry){
  try{
    let list = await loadLeaderboard();
    list.push(entry);
    list.sort((a,b)=> b.score - a.score);
    list = list.slice(0, 100);
    await window.storage.set(LB_KEY, JSON.stringify(list), true);
    return list;
  }catch(e){
    console.error("storage save failed", e);
    return null;
  }
}

function persianDigits(n){
  const map = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  return String(n).replace(/[0-9]/g, d => map[d]);
}

function renderBoard(container, list){
  if(!list || list.length === 0){
    container.innerHTML = `<div class="empty-note">هنوز کسی وارد میدان نشده. اولین نفر باش!</div>`;
    return;
  }
  let rows = list.slice(0,20).map((e,i)=>{
    return `<tr>
      <td class="rank">${persianDigits(i+1)}</td>
      <td>${escapeHtml(e.name)}</td>
      <td class="num">${persianDigits(e.score)}</td>
      <td class="num">${persianDigits(e.level)}</td>
    </tr>`;
  }).join("");
  container.innerHTML = `<table class="board">
    <thead><tr><th>#</th><th>نام</th><th>امتیاز</th><th>مرحله</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   CANVAS / GAME SETUP
============================================================ */
const canvas = document.getElementById("battlefield");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio||1, 2);

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   GAME STATE
============================================================ */
const MAX_LEVEL = 20;
let playerName = "";
let state = "menu"; // menu | board | intro | playing | end
let raf = null;
let lastTime = 0;

let game = {
  level: 1,
  score: 0,
  coins: 0,
  totalCoinsEver: 0,
};

let player, enemies, bullets, enemyBullets, obstacles, coinsList, particles;
let fireCooldown = 0;
let fireInterval = 480; // ms, improves slightly with coins
let joy = { active:false, dx:0, dy:0, id:null };

function resetRun(){
  game.level = 1;
  game.score = 0;
  game.coins = 0;
  game.totalCoinsEver = 0;
  fireInterval = 480;
}

function makePlayer(){
  return {
    x: W/2, y: H*0.72,
    r: 15,
    speed: 175,
    hp: 5, maxHp: 5,
    facing: -Math.PI/2,
  };
}

/* ---------- level generation ---------- */
function isBossLevel(lv){ return lv % 5 === 0; }

function generateLevel(lv){
  enemies = [];
  bullets = [];
  enemyBullets = [];
  obstacles = [];
  coinsList = [];
  particles = [];
  player = makePlayer();

  const playSafeR = 130;

  // obstacles (cover) - increase with level
  const obstacleCount = lv >= 3 ? Math.min(2 + Math.floor((lv-2)/2), 9) : 0;
  for(let i=0;i<obstacleCount;i++){
    let ow = 46 + Math.random()*46, oh = 20 + Math.random()*20;
    let ox, oy, tries=0;
    do{
      ox = 30 + Math.random()*(W-60-ow);
      oy = H*0.12 + Math.random()*(H*0.55);
      tries++;
    } while(dist(ox+ow/2, oy+oh/2, player.x, player.y) < playSafeR && tries < 30);
    obstacles.push({x:ox,y:oy,w:ow,h:oh});
  }

  if(isBossLevel(lv)){
    const bossHp = 26 + lv*4;
    enemies.push({
      x: W/2, y: H*0.22, r: 34,
      hp: bossHp, maxHp: bossHp,
      speed: 34 + lv*1.2,
      shootCd: 0, shootEvery: 900,
      isBoss:true, phase:0,
    });
  } else {
    const count = Math.min(3 + Math.floor(lv*1.4), 22);
    const eHp = 1 + Math.floor(lv/4);
    const eSpeed = 44 + lv*3.2;
    for(let i=0;i<count;i++){
      let ex, ey, tries=0;
      do{
        ex = 30 + Math.random()*(W-60);
        ey = H*0.08 + Math.random()*(H*0.45);
        tries++;
      } while(dist(ex,ey,player.x,player.y) < playSafeR && tries < 30);
      enemies.push({
        x:ex, y:ey, r:13,
        hp:eHp, maxHp:eHp,
        speed: eSpeed*(0.85+Math.random()*0.3),
        shootCd: Math.random()*800,
        shootEvery: Math.max(1500 - lv*35, 550),
      });
    }
  }

  // coins
  const coinCount = 5 + Math.floor(lv/2);
  for(let i=0;i<coinCount;i++){
    let cx, cy, tries=0;
    do{
      cx = 24 + Math.random()*(W-48);
      cy = H*0.15 + Math.random()*(H*0.6);
      tries++;
    } while(rectListHit(cx,cy,10,obstacles) && tries<30);
    coinsList.push({x:cx,y:cy,r:8,taken:false, spin:Math.random()*Math.PI*2});
  }
}

function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }
function rectHit(px,py,pr, rect){
  const closestX = clamp(px, rect.x, rect.x+rect.w);
  const closestY = clamp(py, rect.y, rect.y+rect.h);
  return dist(px,py,closestX,closestY) < pr;
}
function rectListHit(px,py,pr,list){
  for(const r of list) if(rectHit(px,py,pr,r)) return true;
  return false;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ============================================================
   INPUT — virtual joystick
============================================================ */
const joyzone = document.getElementById("joyzone");
const joyBase = document.getElementById("joy-base");
const joyKnob = document.getElementById("joy-knob");
let joyOrigin = {x:0,y:0};

function joyStart(x,y,id){
  joy.active = true; joy.id = id;
  joyOrigin = {x,y};
  joyBase.style.display = "block";
  joyBase.style.left = (x-52)+"px";
  joyBase.style.top = (y-52)+"px";
  joyKnob.style.left = (x-23)+"px";
  joyKnob.style.top = (y-23)+"px";
}
function joyMove(x,y){
  if(!joy.active) return;
  let dx = x - joyOrigin.x, dy = y - joyOrigin.y;
  const maxR = 50;
  const d = Math.hypot(dx,dy);
  if(d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; }
  joy.dx = dx/maxR; joy.dy = dy/maxR;
  joyKnob.style.left = (joyOrigin.x+dx-23)+"px";
  joyKnob.style.top = (joyOrigin.y+dy-23)+"px";
}
function joyEnd(){
  joy.active = false; joy.dx = 0; joy.dy = 0; joy.id = null;
  joyBase.style.display = "none";
}

joyzone.addEventListener("touchstart", e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY, t.identifier);
}, {passive:false});
joyzone.addEventListener("touchmove", e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id) joyMove(t.clientX, t.clientY);
  }
}, {passive:false});
joyzone.addEventListener("touchend", e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id) joyEnd();
  }
}, {passive:false});
joyzone.addEventListener("touchcancel", joyEnd);

// mouse fallback for desktop testing
let mouseDown = false;
joyzone.addEventListener("mousedown", e=>{ mouseDown=true; joyStart(e.clientX,e.clientY,'m'); });
window.addEventListener("mousemove", e=>{ if(mouseDown) joyMove(e.clientX,e.clientY); });
window.addEventListener("mouseup", ()=>{ if(mouseDown){ mouseDown=false; joyEnd(); } });

// keyboard fallback
const keys = {};
window.addEventListener("keydown", e=>{ keys[e.key.toLowerCase()]=true; });
window.addEventListener("keyup", e=>{ keys[e.key.toLowerCase()]=false; });

/* ============================================================
   UPDATE LOGIC
============================================================ */
function nearestEnemy(x,y){
  let best=null, bd=Infinity;
  for(const en of enemies){
    const d = dist(x,y,en.x,en.y);
    if(d<bd){ bd=d; best=en; }
  }
  return {enemy:best, d:bd};
}

function tryMove(entity, nx, ny, r){
  if(!rectListHit(nx, entity.y, r, obstacles)) entity.x = clamp(nx, r, W-r);
  if(!rectListHit(entity.x, ny, r, obstacles)) entity.y = clamp(ny, r, H-r);
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = 60+Math.random()*140;
    particles.push({x,y,vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:0.5+Math.random()*0.4, maxLife:0.9, color});
  }
}

function centerMsg(text){
  const el = document.getElementById("center-msg-text");
  el.textContent = text;
  el.style.transition = "none";
  el.style.opacity = "1";
  el.style.transform = "scale(1.15)";
  requestAnimationFrame(()=>{
    el.style.transition = "opacity 1.1s ease, transform 1.1s ease";
    el.style.opacity = "0";
    el.style.transform = "scale(1)";
  });
}

function update(dt){
  // ---- player movement ----
  let mx = joy.dx, my = joy.dy;
  if(keys['arrowleft']||keys['a']) mx = -1;
  if(keys['arrowright']||keys['d']) mx = 1;
  if(keys['arrowup']||keys['w']) my = -1;
  if(keys['arrowdown']||keys['s']) my = 1;
  const mlen = Math.hypot(mx,my);
  if(mlen > 0.15){
    const nx = player.x + (mx/Math.max(mlen,1))*player.speed*dt*Math.min(mlen,1);
    const ny = player.y + (my/Math.max(mlen,1))*player.speed*dt*Math.min(mlen,1);
    tryMove(player, nx, ny, player.r);
    player.facing = Math.atan2(my,mx);
  }

  // ---- auto fire ----
  fireCooldown -= dt*1000;
  const {enemy:target, d:td} = nearestEnemy(player.x,player.y);
  if(target && td < 430 && fireCooldown <= 0){
    fireCooldown = fireInterval;
    const ang = Math.atan2(target.y-player.y, target.x-player.x);
    bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,r:4,dmg:1});
    player.facing = ang;
  }

  // ---- bullets move ----
  for(const b of bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  bullets = bullets.filter(b=> b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20 && !rectListHit(b.x,b.y,2,obstacles));

  for(const b of enemyBullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  enemyBullets = enemyBullets.filter(b=> b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20 && !rectListHit(b.x,b.y,2,obstacles));

  // ---- enemies AI ----
  for(const en of enemies){
    const d = dist(en.x,en.y,player.x,player.y);
    const preferred = en.isBoss ? 220 : 150;
    if(d > preferred+10){
      let ang = Math.atan2(player.y-en.y, player.x-en.x);
      let nx = en.x + Math.cos(ang)*en.speed*dt;
      let ny = en.y + Math.sin(ang)*en.speed*dt;
      if(rectListHit(nx,ny,en.r,obstacles)){
        // simple steer-around
        let found=false;
        for(const delta of [0.6,-0.6,1.2,-1.2,1.8,-1.8]){
          const a2 = ang+delta;
          const tx = en.x+Math.cos(a2)*en.speed*dt;
          const ty = en.y+Math.sin(a2)*en.speed*dt;
          if(!rectListHit(tx,ty,en.r,obstacles)){ nx=tx; ny=ty; found=true; break; }
        }
        if(!found){ nx = en.x; ny = en.y; }
      }
      en.x = clamp(nx, en.r, W-en.r);
      en.y = clamp(ny, en.r, H-en.r);
    }
